apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: muztagh-platform
  namespace: argocd
spec:
  project: muztagh
  source:
    repoURL: https://github.com/huangruidtu/Muztagh-Developer-Platform.git
    targetRevision: main
    path: platform/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
