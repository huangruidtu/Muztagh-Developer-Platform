apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: muztagh
  namespace: argocd
spec:
  description: Muztagh platform and domain declaration reconciliation
  sourceRepos:
    - https://github.com/huangruidtu/Muztagh-Developer-Platform.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: platform-system
      server: https://kubernetes.default.svc
    - namespace: user-space
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.crossplane.io
      kind: CompositeResourceDefinition
    - group: apiextensions.crossplane.io
      kind: Composition
    - group: pkg.crossplane.io
      kind: Function
    - group: pkg.crossplane.io
      kind: Provider
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: kyverno.io
      kind: ClusterPolicy
    - group: platform.muztagh.io
      kind: Workspace
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: platform.muztagh.io
      kind: Application
    - group: platform.muztagh.io
      kind: DataStore
