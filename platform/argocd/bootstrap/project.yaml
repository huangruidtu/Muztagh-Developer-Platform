apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: muztagh
  namespace: argocd
spec:
  description: Muztagh platform and domain declaration reconciliation
  sourceRepos:
    - https://github.com/huangruidtu/Muztagh-Developer-Platform.git
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
