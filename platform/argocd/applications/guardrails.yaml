apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: muztagh-guardrails
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: muztagh
  source:
    repoURL: https://github.com/huangruidtu/Muztagh-Developer-Platform.git
    targetRevision: main
    path: platform/security/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
