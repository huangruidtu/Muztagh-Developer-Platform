apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: muztagh-user-space
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: muztagh-user-space
  source:
    repoURL: https://github.com/huangruidtu/Muztagh-Developer-Platform.git
    targetRevision: main
    path: user-space/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: cpemon-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
