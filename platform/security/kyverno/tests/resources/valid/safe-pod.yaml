apiVersion: v1
kind: Pod
metadata:
  name: safe-workload
  namespace: policy-test
  labels:
    app.kubernetes.io/managed-by: crossplane
    platform.muztagh.io/application: safe-workload
    platform.muztagh.io/managed-by: platform
    platform.muztagh.io/platform: muztagh
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: application
      image: registry.example.com/team/safe-workload:v1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
