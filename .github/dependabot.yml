version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
  - package-ecosystem: terraform
    directories:
      - /foundation/terraform/environments/dev
      - /foundation/terraform/environments/prod
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Copenhagen
