name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: v0.64.0
          cache: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive foundation/terraform
      - name: Initialize and validate Terraform environments
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            foundation/terraform/environments/dev \
            foundation/terraform/environments/prod
          do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
      - name: Initialize TFLint
        run: tflint --chdir=foundation/terraform --recursive --init
      - name: Run TFLint
        run: >-
          tflint --chdir=foundation/terraform --recursive --format=compact
          --minimum-failure-severity=warning

  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0
        with:
          version: v1.37.1
      - name: Install pinned validation tools
        run: bash validation/scripts/install-ci-tools.sh
      - name: Validate workflow syntax
        run: actionlint .github/workflows/pr-validation.yaml
      - name: Lint YAML
        run: yamllint --config-file .yamllint.yaml .
      - name: Run Crossplane validation
        shell: pwsh
        run: ./platform/crossplane/scripts/validate.ps1
      - name: Run Argo CD validation
        shell: pwsh
        run: ./platform/argocd/scripts/validate.ps1
      - name: Run observability validation
        shell: pwsh
        run: ./platform/observability/scripts/validate.ps1
      - name: Validate rendered Kubernetes schemas
        shell: pwsh
        run: ./validation/scripts/validate-manifests.ps1
      - name: Prove invalid schema fixture is rejected
        shell: pwsh
        run: ./validation/scripts/test-negative-fixtures.ps1
      - name: Check Git whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  policy:
    name: policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0
        with:
          version: v1.37.1
      - name: Install Kyverno CLI
        run: bash validation/scripts/install-kyverno-cli.sh
      - name: Run Kyverno policy tests
        shell: pwsh
        run: ./platform/security/kyverno/scripts/validate.ps1

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository configuration and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table
          version: v0.76.0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.30.1

  required-check:
    name: required-check
    if: always()
    needs:
      - terraform
      - manifests
      - policy
      - security
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all primary jobs to succeed
        env:
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          MANIFESTS_RESULT: ${{ needs.manifests.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$TERRAFORM_RESULT" \
            "$MANIFESTS_RESULT" \
            "$POLICY_RESULT" \
            "$SECURITY_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required job ended with result: $result"
              exit 1
            fi
          done
